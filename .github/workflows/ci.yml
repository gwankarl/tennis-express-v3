name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  checks:
    name: Format, lint, and typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install pinned npm version
        run: npm install --global npm@11.19.1

      - name: Verify runtime versions
        run: |
          test "$(node --version)" = "v24.22.2"
          test "$(npm --version)" = "11.19.1"

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint workspaces
        run: npm run lint

      - name: Typecheck backend
        run: npm run typecheck --workspace=@tennis-xpress/backend

      - name: Typecheck frontend
        run: npm run typecheck --workspace=@tennis-xpress/frontend
